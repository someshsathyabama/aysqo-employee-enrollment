server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: aysqo-employee-enrollment-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Actuator configuration for monitoring and health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Application-level configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  admin:
    default-username: ${APP_ADMIN_USERNAME:admin}
    default-email: ${APP_ADMIN_EMAIL:admin@aysqo.com}
    default-password: ${APP_ADMIN_PASSWORD:Admin@123}
  hr:
    default-username: ${APP_HR_USERNAME:hr_manager}
    default-email: ${APP_HR_EMAIL:hr@aysqo.com}
    default-password: ${APP_HR_PASSWORD:Hr@123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
